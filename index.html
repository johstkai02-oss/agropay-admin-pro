<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AgroPay Central & Catálogo</title>
<script src="qr_gen.js"></script><script src="qr_scan.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#06100c;color:#ecfdf5;padding:12px}
.card{background:#0d1f18;border:1px solid #10b981;border-radius:12px;padding:12px;margin-bottom:10px}
.saldo{font-size:28px;font-weight:bold;color:#34d399;margin:4px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
input{width:100%;background:#06100c;border:1px solid #059669;color:#fff;padding:9px;border-radius:8px;margin-top:6px;font-size:13px}
button{width:100%;background:#10b981;color:#000;border:none;padding:10px;border-radius:8px;font-weight:bold;margin-top:6px;font-size:12px}
.prod{background:#064e3b;color:#a7f3d0;border:1px solid #10b981;margin-top:0}
.adm{background:#7c2d12;color:#fed7aa;border:1px solid #f97316}
#qr-box{background:#fff;padding:10px;border-radius:8px;margin-top:8px;display:none;justify-content:center}
#cam{width:100%;border-radius:8px;margin-top:8px;display:none}
.mov{font-size:11px;padding:4px 0;border-bottom:1px solid #064e3b;color:#a7f3d0}
</style></head>
<body>
<div class="card">
<div style="font-size:11px;color:#6ee7b7" id="id-txt">BÓVEDA CIFRADA AES-256</div>
<div class="saldo" id="saldo-txt">$0.00 USD</div>
<input type="text" id="nom" placeholder="Nombre Comercio / Finca">
<input type="password" id="pin" placeholder="PIN Bóveda (ej. 1234)">
<button onclick="abrirBoveda()">DESBLOQUEAR BÓVEDA</button>
</div>

<div class="card">
<b>1. CATÁLOGO RÁPIDO (PAGO CON 1 TOQUE)</b>
<div class="grid">
<button class="prod" onclick="pagoRapido(1.00,'Pasaje Rural $1')">Pasaje ($1.00)</button>
<button class="prod" onclick="pagoRapido(3.50,'Almuerzo $3.50')">Almuerzo ($3.50)</button>
<button class="prod" onclick="pagoRapido(12.00,'Jornal Agrícola $12')">Jornal ($12.00)</button>
<button class="prod" onclick="pagoRapido(25.00,'Quintal Producto $25')">Quintal ($25.00)</button>
</div>
<input type="number" id="monto" placeholder="Otro monto USD">
<button onclick="pagoRapido(+document.getElementById('monto').value,'Pago Manual')">GENERAR QR DE PAGO</button>
<div id="qr-box"></div>
</div>
<div class="card">
<b>2. COBRAR Y LIQUIDAR AUDITORÍAS</b>
<button style="background:#0284c7;color:#fff" onclick="escanearQR()">ESCANEAR QR (PAGO O RECARGA)</button>
<video id="cam" autoplay playsinline muted></video>
<button style="background:#0284c7;color:#fff" onclick="exportarAuditoria()">EXPORTAR REPORTE TRAZABLE</button><button style="background:#065f46;color:#fff" onclick="respaldoSeguro()">RESPALDO BÓVEDA CIFRADA</button><button style="background:#047857;color:#fff" onclick="document.getElementById(x27inp-restx27).click()">RESTAURAR RESPALDO (.JSON)</button><input type="file" id="inp-rest" accept=".json" style="display:none" onchange="restaurarBoveda(event)">
<div id="lista" style="margin-top:6px"></div>
</div>

<div class="card" style="border-color:#f97316">
<b style="color:#fdba74">3. PANEL ADMINISTRADOR (CAJA CENTRAL)</b>
<input type="password" id="clave-adm" placeholder="Clave Maestra Caja (ej. ADMIN2026)">
<input type="number" id="monto-rec" placeholder="Efectivo recibido USD (ej. 50)">
<button class="adm" onclick="emitirRecarga()">EMITIR QR DE RECARGA OFICIAL</button>
<input type="file" id="file-liq" accept=".json" onchange="liquidarAfiliado(event)">
<div id="res-liq" style="font-size:12px;color:#fed7aa;margin-top:6px">Sube un reporte .json para calcular liquidación y comisión (1.5%).</div>
</div>
<script>
let boveda=null,claveCrypto=null,gps="Sin GPS";
if("geolocation" in navigator)navigator.geolocation.watchPosition(p=>gps=`${p.coords.latitude.toFixed(5)},${p.coords.longitude.toFixed(5)}`);
async function derivar(pin){
const e=new TextEncoder(),b=await crypto.subtle.importKey("raw",e.encode(pin.padEnd(8,"0")),"PBKDF2",false,["deriveKey"]);
return crypto.subtle.deriveKey({name:"PBKDF2",salt:e.encode("AGROPRO"),iterations:10000,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function guardar(){
const iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:"AES-GCM",iv},claveCrypto,new TextEncoder().encode(JSON.stringify(boveda)));
localStorage.setItem("agropay_pro",JSON.stringify({iv:Array.from(iv),data:Array.from(new Uint8Array(c))}));ui();
}
async function abrirBoveda(){
claveCrypto=await derivar(document.getElementById("pin").value||"1234");
const r=localStorage.getItem("agropay_pro");
if(r){try{const o=JSON.parse(r),d=await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(o.iv)},claveCrypto,new Uint8Array(o.data));boveda=JSON.parse(new TextDecoder().decode(d));}catch(e){return alert("PIN incorrecto");}}
else{boveda={id:"AG-"+Math.random().toString(36).slice(2,8).toUpperCase(),nom:document.getElementById("nom").value||"Comercio",saldo:0,movs:[],usados:[]};await guardar();}
ui();
}
function ui(){
if(!boveda)return;document.getElementById("id-txt").innerText=`ID: ${boveda.id} | ${boveda.nom}`;
document.getElementById("saldo-txt").innerText=`$${boveda.saldo.toFixed(2)} USD`;
document.getElementById("lista").innerHTML=boveda.movs.slice(0,5).map(m=>`<div class="mov">${m}</div>`).join("");
}
async function firmar(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t+"|SELLO_CENTRAL"));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,14).toUpperCase();}
async function pagoRapido(m,c){
if(!boveda)return alert("Desbloquea tu bóveda");if(!m||m<=0||m>boveda.saldo)return alert("Saldo insuficiente");
const tx="TX"+Date.now().toString(36).toUpperCase(),vale=JSON.stringify({tipo:"PAGO",tx,de:boveda.id,m,c,s:await firmar(`${tx}|${boveda.id}|${m}`)});
boveda.saldo-=m;boveda.usados.push(tx);boveda.movs.unshift(`ENVÍO -$${m.toFixed(2)} (${c})`);await guardar();
const box=document.getElementById("qr-box");box.innerHTML="";box.style.display="flex";new QRCode(box,{text:vale,width:190,height:190});
}
async function emitirRecarga(){
const hAdm=await firmar(document.getElementById("clave-adm").value);if(hAdm!=="3D219E0A4C8B1F")return alert("Clave Maestra inválida");
const m=parseFloat(document.getElementById("monto-rec").value);if(!m||m<=0)return alert("Ingresa monto recibido");
const tx="RC"+Date.now().toString(36).toUpperCase(),vale=JSON.stringify({tipo:"RECARGA",tx,de:"CAJA_CENTRAL",m,c:"Recarga Efectivo",s:await firmar(`${tx}|CAJA_CENTRAL|${m}`)});
const box=document.getElementById("qr-box");box.innerHTML="";box.style.display="flex";new QRCode(box,{text:vale,width:190,height:190});
alert(`QR de Recarga por $${m.toFixed(2)} listo para escanear.`);
}
async function escanearQR(){
if(!boveda)return alert("Desbloquea tu bóveda");
const vid=document.getElementById("cam"),cvs=document.createElement("canvas"),ctx=cvs.getContext("2d");
const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});vid.srcObject=st;vid.style.display="block";await vid.play();
const loop=async()=>{
if(vid.readyState===vid.HAVE_ENOUGH_DATA){cvs.width=vid.videoWidth;cvs.height=vid.videoHeight;ctx.drawImage(vid,0,0);
const code=jsQR(ctx.getImageData(0,0,cvs.width,cvs.height).data,cvs.width,cvs.height);
if(code){st.getTracks().forEach(t=>t.stop());vid.style.display="none";const v=JSON.parse(code.data);
if(v.s!==await firmar(`${v.tx}|${v.de}|${v.m}`)||boveda.usados.includes(v.tx))return alert("QR inválido o ya usado");
boveda.saldo+=v.m;boveda.usados.push(v.tx);boveda.movs.unshift(`${v.tipo} +$${v.m.toFixed(2)} | DE:${v.de} | GPS:${gps}`);await guardar();return alert(`¡${v.tipo} de $${v.m.toFixed(2)} acreditada!`);}}
requestAnimationFrame(loop);};loop();
}
function exportarAuditoria(){
if(!boveda)return alert("Desbloquea tu bóveda");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({id:boveda.id,comercio:boveda.nom,saldo:boveda.saldo,gps,movs:boveda.movs},null,2)],{type:"application/json"}));
a.download=`Liquidacion_${boveda.id}.json`;a.click();
}
function liquidarAfiliado(ev){
const f=ev.target.files[0];if(!f)return;const r=new FileReader();
r.onload=e=>{const d=JSON.parse(e.target.result),com=(d.saldo*0.015).toFixed(2),neto=(d.saldo-com).toFixed(2);
document.getElementById("res-liq").innerText=`Comercio: ${d.comercio} (${d.id}) | Bruto: $${d.saldo.toFixed(2)} | Comisión 1.5%: $${com} | A pagar: $${neto}`;};
r.readAsText(f);
}
</script><script src="antifraude.js"></script><script src="legal.js"></script><script src="comercial.js"></script><script src="institucional.js"></script><script src="garantias.js"></script><script src="academia.js"></script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");</script></body></html>
