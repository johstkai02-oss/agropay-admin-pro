<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AgroPay - Caja Central</title><script src="qr_gen.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#120905;color:#fed7aa;padding:14px}
.card{background:#231109;border:1px solid #f97316;border-radius:12px;padding:14px;margin-bottom:12px}
input{width:100%;background:#120905;border:1px solid #ea580c;color:#fff;padding:10px;border-radius:8px;margin-top:8px}
button{width:100%;background:#f97316;color:#000;border:none;padding:11px;border-radius:8px;font-weight:bold;margin-top:10px}
#qr-box{background:#fff;padding:12px;border-radius:8px;margin-top:10px;display:none;justify-content:center}
</style></head>
<body>
<div class="card"><b>CAJA CENTRAL // EMITIR RECARGA OFICIAL</b>
<input type="password" id="clave" placeholder="Clave Maestra (ej. ADMIN2026)">
<input type="number" id="monto" placeholder="Efectivo recibido USD (ej. 50)">
<button onclick="emitir()">GENERAR QR DE RECARGA</button><div id="qr-box"></div></div>
<div class="card"><b>LIQUIDAR REPORTE DE COMERCIO (.JSON)</b>
<input type="file" accept=".json" onchange="liquidar(event)">
<div id="res" style="margin-top:8px;font-size:13px">Sube el archivo enviado por el afiliado.</div></div>
<script>
async function firmar(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t+"|SELLO_CENTRAL"));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,14).toUpperCase();}
async function emitir(){
if(document.getElementById("clave").value!=="ADMIN2026")return alert("Clave incorrecta");
const m=parseFloat(document.getElementById("monto").value);if(!m||m<=0)return alert("Monto inválido");
const tx="RC"+Date.now().toString(36).toUpperCase(),vale=JSON.stringify({tipo:"RECARGA",tx,de:"CAJA_CENTRAL",m,c:"Recarga Efectivo",s:await firmar(`${tx}|CAJA_CENTRAL|${m}`)});
const box=document.getElementById("qr-box");box.innerHTML="";box.style.display="flex";new QRCode(box,{text:vale,width:200,height:200});
}
function liquidar(ev){
const f=ev.target.files;if(!f)return;const r=new FileReader();
r.onload=e=>{const d=JSON.parse(e.target.result),com=(d.saldo*0.015).toFixed(2),neto=(d.saldo-com).toFixed(2);
document.getElementById("res").innerText=`Comercio: ${d.comercio} (${d.id}) | Bruto: $${d.saldo.toFixed(2)} | Comisión 1.5%: $${com} | Entregar efectivo: $${neto}`;};
r.readAsText(f);
}
</script></body></html>
